services:
  fvcd:
    build:
      context: .
      target: systemd-test
    image: fvc:dev
    container_name: fvcd
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - fvc-data:/var/lib/fvc
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    cgroup: host
    stop_signal: SIGRTMIN+3

volumes:
  fvc-data:
