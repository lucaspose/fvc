syntax = "proto3";

// Le package correspond maintenant au nom de ton projet : fvc
package fvc;

// Option mise à jour pour que le code Go généré se place dans le bon dossier
option go_package = "./proto";

// Import officiel de Google pour les dates et heures
import "google/protobuf/timestamp.proto";

// Le service est renommé FvcService (consommé par fvc, implémenter par fvcd)
service FvcService {
    // Phase 1 & 5 : Lance une microVM
    rpc Run(RunRequest) returns (RunResponse);

    // Lance une microVM en streamant les étapes de préparation
    rpc RunStream(RunRequest) returns (stream RunEvent);

    // Phase 5 : Arrête proprement une microVM
    rpc Stop(StopRequest) returns (StopResponse);

    // Relance une microVM stoppée
    rpc Start(StartRequest) returns (StartResponse);

    // Supprime une microVM stoppée et ses fichiers locaux
    rpc Rm(RmRequest) returns (RmResponse);

    // Renomme une microVM
    rpc Rename(RenameRequest) returns (RenameResponse);

    // Met à jour les ressources persistées d'une microVM stoppée
    rpc Update(UpdateRequest) returns (UpdateResponse);

    // Retourne les chemins locaux nécessaires à la console série
    rpc ConsoleInfo(ConsoleInfoRequest) returns (ConsoleInfoResponse);

    // Exécute une commande dans une microVM via l'agent invité
    rpc Exec(ExecRequest) returns (stream ExecEvent);

    // Retourne les détails complets d'une microVM
    rpc Inspect(InspectRequest) returns (InspectResponse);

    // Télécharge une image dans le cache local
    rpc PullImage(PullImageRequest) returns (PullImageResponse);

    // Télécharge une image en streamant la progression
    rpc PullImageStream(PullImageRequest) returns (stream OperationEvent);

    // Liste les images présentes dans le cache local
    rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

    // Nettoie les ressources locales inutilisées
    rpc Prune(PruneRequest) returns (PruneResponse);

    // Retourne les métriques host des microVMs
    rpc Stats(StatsRequest) returns (StatsResponse);

    // Attend qu'une microVM atteigne l'état stopped/down
    rpc Wait(WaitRequest) returns (WaitResponse);

    // Force l'arrêt d'une microVM
    rpc Kill(KillRequest) returns (KillResponse);

    // Crée un snapshot du disque d'une microVM stoppée
    rpc SnapshotCreate(SnapshotCreateRequest) returns (SnapshotCreateResponse);

    // Liste les snapshots d'une microVM
    rpc SnapshotList(SnapshotListRequest) returns (SnapshotListResponse);

    // Restaure un snapshot sur le disque d'une microVM stoppée
    rpc SnapshotRestore(SnapshotRestoreRequest) returns (SnapshotRestoreResponse);

    // Supprime un snapshot
    rpc SnapshotRemove(SnapshotRemoveRequest) returns (SnapshotRemoveResponse);

    // Construit une image locale depuis un Fvcfile TOML
    rpc BuildImage(BuildImageRequest) returns (BuildImageResponse);

    // Construit une image locale en streamant les étapes
    rpc BuildImageStream(BuildImageRequest) returns (stream OperationEvent);

    // Inspecte une image locale
    rpc ImageInspect(ImageInspectRequest) returns (ImageInspectResponse);

    // Supprime une image locale
    rpc ImageRemove(ImageRemoveRequest) returns (ImageRemoveResponse);

    // Ajoute un tag local à une image
    rpc ImageTag(ImageTagRequest) returns (ImageTagResponse);

    // Importe un rootfs ext4 comme image locale
    rpc ImageImport(ImageImportRequest) returns (ImageImportResponse);

    // Exporte une image locale vers un fichier ext4
    rpc ImageExport(ImageExportRequest) returns (ImageExportResponse);

    // Liste l'historique metadata d'une image
    rpc ImageHistory(ImageHistoryRequest) returns (ImageHistoryResponse);

    // Supprime les images locales inutilisées
    rpc ImagePrune(ImagePruneRequest) returns (ImagePruneResponse);

    // Crée un volume persistant local
    rpc VolumeCreate(VolumeCreateRequest) returns (VolumeCreateResponse);

    // Liste les volumes persistants locaux
    rpc VolumeList(VolumeListRequest) returns (VolumeListResponse);

    // Inspecte un volume persistant local
    rpc VolumeInspect(VolumeInspectRequest) returns (VolumeInspectResponse);

    // Supprime un volume persistant local
    rpc VolumeRemove(VolumeRemoveRequest) returns (VolumeRemoveResponse);

    // Supprime les volumes locaux inutilisés
    rpc VolumePrune(VolumePruneRequest) returns (VolumePruneResponse);

    // Phase 1 & 5 : Liste toutes les microVMs
    rpc Ps(PsRequest) returns (PsResponse);

    // Phase 5 : Stream les logs textuels en temps réel
    rpc StreamLogs(LogsRequest) returns (stream LogsResponse);

    // Retourne les diagnostics runtime du daemon
    rpc Diagnostics(DiagnosticsRequest) returns (DiagnosticsResponse);
}

// --- Messages pour la commande RUN ---
message RunRequest {
    string source = 1; // Le chemin du Vmfile ou le nom de l'image
    VmConfig config = 2;
    string name = 3;
    bool auto_remove = 4;
    string image_source = 5;
    string docker_source = 6;
    string pull_policy = 7;
}

message RunResponse {
    string vm_id = 1;         // L'identifiant unique généré (ex: vm-fvc-999)
    string status = 2;        // Statut initial
    string error_message = 3; // Message d'erreur si échec
}

message RunEvent {
    string stage = 1;
    string status = 2;
    string message = 3;
    string vm_id = 4;
    string error_message = 5;
    int64 current = 6;
    int64 total = 7;
    string detail = 8;
}

message OperationEvent {
    string stage = 1;
    string status = 2;
    string message = 3;
    string error_message = 4;
    int64 current = 5;
    int64 total = 6;
    string detail = 7;
    string image = 8;
    string path = 9;
}

// --- Messages pour la commande STOP ---
message StopRequest {
    string vm_id = 1;
    int32 timeout_seconds = 2;
}

message StopResponse {
    bool success = 1;
    string message = 2;
}

message StartRequest {
    string vm_id = 1;
}

message StartResponse {
    bool success = 1;
    string message = 2;
}

message RmRequest {
    string vm_id = 1;
}

message RmResponse {
    bool success = 1;
    string message = 2;
}

message RenameRequest {
    string vm_id = 1;
    string name = 2;
}

message RenameResponse {
    bool success = 1;
    string message = 2;
}

message UpdateRequest {
    string vm_id = 1;
    int32 cpus = 2;
    int32 memory_mb = 3;
}

message UpdateResponse {
    bool success = 1;
    string message = 2;
}

message ConsoleInfoRequest {
    string vm_id = 1;
}

message ConsoleInfoResponse {
    bool success = 1;
    string message = 2;
    string vm_id = 3;
    string log_path = 4;
    string input_path = 5;
}

message ExecRequest {
    string vm_id = 1;
    repeated string command = 2;
    repeated string env = 3;
    string workdir = 4;
}

message ExecEvent {
    string stream = 1;
    bytes data = 2;
    int32 exit_code = 3;
    string error_message = 4;
}

message InspectRequest {
    string vm_id = 1;
}

message InspectResponse {
    bool success = 1;
    string message = 2;
    VmDetails vm = 3;
}

message PullImageRequest {
    string image = 1;
    string source = 2;
    string target = 3;
}

message PullImageResponse {
    bool success = 1;
    string message = 2;
    string image = 3;
    string path = 4;
}

message ListImagesRequest {}

message ImageDetails {
    string image = 1;
    string path = 2;
    int64 size_bytes = 3;
    string digest = 4;
    string source = 5;
    google.protobuf.Timestamp created_at = 6;
    map<string, string> labels = 7;
    repeated string env = 8;
    repeated string cmd = 9;
    string workdir = 10;
    repeated int32 exposed_ports = 11;
}

message ListImagesResponse {
    repeated ImageDetails images = 1;
}

message PruneRequest {
    bool dry_run = 1;
}

message PruneItem {
    string kind = 1;
    string path = 2;
    int64 size_bytes = 3;
}

message PruneResponse {
    bool success = 1;
    string message = 2;
    int32 removed_files = 3;
    int64 freed_bytes = 4;
    repeated PruneItem items = 5;
    bool dry_run = 6;
}

message StatsRequest {
    string vm_id = 1;
}

message VmStats {
    string vm_id = 1;
    int32 pid = 2;
    string status = 3;
    double cpu_percent = 4;
    int64 rss_bytes = 5;
    int32 memory_mb = 6;
    int64 uptime_seconds = 7;
}

message StatsResponse {
    repeated VmStats stats = 1;
}

message WaitRequest {
    string vm_id = 1;
    int32 timeout_seconds = 2;
}

message WaitResponse {
    bool success = 1;
    string message = 2;
    string status = 3;
    int32 exit_code = 4;
}

message KillRequest {
    string vm_id = 1;
}

message KillResponse {
    bool success = 1;
    string message = 2;
}

message SnapshotCreateRequest {
    string vm_id = 1;
    string name = 2;
}

message SnapshotCreateResponse {
    bool success = 1;
    string message = 2;
    SnapshotDetails snapshot = 3;
}

message SnapshotListRequest {
    string vm_id = 1;
}

message SnapshotDetails {
    string name = 1;
    string path = 2;
    int64 size_bytes = 3;
}

message SnapshotListResponse {
    bool success = 1;
    string message = 2;
    repeated SnapshotDetails snapshots = 3;
}

message SnapshotRestoreRequest {
    string vm_id = 1;
    string name = 2;
}

message SnapshotRestoreResponse {
    bool success = 1;
    string message = 2;
    SnapshotDetails snapshot = 3;
}

message SnapshotRemoveRequest {
    string vm_id = 1;
    string name = 2;
}

message SnapshotRemoveResponse {
    bool success = 1;
    string message = 2;
}

message BuildImageRequest {
    string context_path = 1;
    string tag = 2;
}

message BuildImageResponse {
    bool success = 1;
    string message = 2;
    string image = 3;
    string path = 4;
}

message ImageInspectRequest {
    string image = 1;
}

message ImageInspectResponse {
    bool success = 1;
    string message = 2;
    ImageDetails image = 3;
}

message ImageRemoveRequest {
    string image = 1;
    bool force = 2;
}

message ImageRemoveResponse {
    bool success = 1;
    string message = 2;
}

message ImageTagRequest {
    string source = 1;
    string target = 2;
}

message ImageTagResponse {
    bool success = 1;
    string message = 2;
    ImageDetails image = 3;
}

message ImageImportRequest {
    string source_path = 1;
    string image = 2;
}

message ImageImportResponse {
    bool success = 1;
    string message = 2;
    ImageDetails image = 3;
}

message ImageExportRequest {
    string image = 1;
    string dest_path = 2;
}

message ImageExportResponse {
    bool success = 1;
    string message = 2;
    string path = 3;
}

message ImageHistoryRequest {
    string image = 1;
}

message ImageHistoryEntry {
    string action = 1;
    string message = 2;
    google.protobuf.Timestamp created_at = 3;
}

message ImageHistoryResponse {
    bool success = 1;
    string message = 2;
    repeated ImageHistoryEntry entries = 3;
}

message ImagePruneRequest {
    bool dry_run = 1;
}

message ImagePruneResponse {
    bool success = 1;
    string message = 2;
    int32 removed_images = 3;
    int64 freed_bytes = 4;
    repeated ImageDetails images = 5;
    bool dry_run = 6;
}

message VolumeCreateRequest {
    string name = 1;
    int64 size_mb = 2;
}

message VolumeDetails {
    string name = 1;
    string path = 2;
    int64 size_bytes = 3;
    int32 used_by = 4;
    bool attached_to_running = 5;
    google.protobuf.Timestamp created_at = 6;
}

message VolumeCreateResponse {
    bool success = 1;
    string message = 2;
    VolumeDetails volume = 3;
}

message VolumeListRequest {}

message VolumeListResponse {
    bool success = 1;
    string message = 2;
    repeated VolumeDetails volumes = 3;
}

message VolumeInspectRequest {
    string name = 1;
}

message VolumeInspectResponse {
    bool success = 1;
    string message = 2;
    VolumeDetails volume = 3;
}

message VolumeRemoveRequest {
    string name = 1;
    bool force = 2;
}

message VolumeRemoveResponse {
    bool success = 1;
    string message = 2;
    VolumeDetails volume = 3;
}

message VolumePruneRequest {
    bool dry_run = 1;
}

message VolumePruneResponse {
    bool success = 1;
    string message = 2;
    int32 removed_volumes = 3;
    int64 freed_bytes = 4;
    repeated VolumeDetails volumes = 5;
    bool dry_run = 6;
}

// --- Messages pour la commande PS ---
message PsRequest {
    bool all = 1;
}

message VmConfig {
    int32 cpus = 1;
    int32 memory_mb = 2;
    repeated string ports = 3;
    bool publish_all = 4;
    string network_mode = 5;
    repeated string volumes = 6;
}

message VmDetails {
    string vm_id = 1;
    int32 pid = 2;
    string status = 3;
    string image = 4;
    VmConfig config = 5;
    google.protobuf.Timestamp created_at = 6;
    string guest_ip = 7;
    string mac_address = 8;
    string tap_name = 9;
    string log_path = 10;
    string drive_path = 11;
    string console_path = 12;
    string name = 13;
    int32 exit_code = 14;
}

message PsResponse {
    repeated VmDetails vms = 1; // La liste de toutes les microVMs
}

// --- Messages pour la commande LOGS ---
message LogsRequest {
    string vm_id = 1;
    bool follow = 2;
    int32 tail = 3;
}

message LogsResponse {
    string line = 1;
    google.protobuf.Timestamp timestamp = 2;
}

message DiagnosticsRequest {}

message DiagnosticCheck {
    string name = 1;
    bool ok = 2;
    string message = 3;
}

message DiagnosticsResponse {
    repeated DiagnosticCheck checks = 1;
    string grpc_network = 2;
    string grpc_address = 3;
    string data_dir = 4;
    string runtime_dir = 5;
    bool network_enabled = 6;
}
